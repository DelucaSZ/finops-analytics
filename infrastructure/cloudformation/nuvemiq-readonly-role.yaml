AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Creates the cross-account read-only role used by NuvemIQ. Deploy this stack
  in every AWS account that will be analyzed.

Parameters:
  CentralRoleArn:
    Type: String
    Description: ARN of the IAM role attached to the NuvemIQ EC2 instance.
    AllowedPattern: '^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/.+$'
  ExternalId:
    Type: String
    MinLength: 16
    NoEcho: true
    Description: Unique External ID generated by NuvemIQ for this account.
  RoleName:
    Type: String
    Default: NuvemIQReadOnly
    Description: Name of the role that NuvemIQ will assume.

Resources:
  NuvemIQReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Read-only inventory, metrics and cost access for NuvemIQ.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref CentralRoleArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
        - arn:aws:iam::aws:policy/CloudWatchReadOnlyAccess
      Policies:
        - PolicyName: NuvemIQCostExplorerReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                  - ce:GetDimensionValues
                  - ce:GetReservationCoverage
                  - ce:GetReservationUtilization
                  - ce:GetSavingsPlansCoverage
                  - ce:GetSavingsPlansUtilization
                  - pricing:GetProducts
                  - pricing:DescribeServices
                Resource: "*"

Outputs:
  RoleArn:
    Description: ARN to register in NuvemIQ.
    Value: !GetAtt NuvemIQReadOnlyRole.Arn
