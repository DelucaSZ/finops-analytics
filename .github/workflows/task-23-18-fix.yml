name: Task 23.18 validation fixes

on:
  push:
    branches: [feat/23-18-cloudwatch-cost-engine]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Update migration head and normalize Python
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/app/tests/test_migrations.py')
          text = path.read_text()
          old = '== "0028_cloudwatch_usage_telemetry"'
          new = '== "0029_cloudwatch_cost_engine"'
          if old not in text and new not in text:
              raise SystemExit('expected migration head assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cd backend
          ruff check --fix app/api/routes/cloudwatch_cost.py app/main.py app/migrations/versions/0029_cloudwatch_cost_engine.py app/models/__init__.py app/models/cloudwatch_pricing.py app/schemas/cloudwatch_cost.py app/services/cloudwatch_cost_engine.py app/services/cloudwatch_pricing.py app/tests/test_cloudwatch_cost_engine.py app/tests/test_migrations.py
          ruff format app/api/routes/cloudwatch_cost.py app/main.py app/migrations/versions/0029_cloudwatch_cost_engine.py app/models/__init__.py app/models/cloudwatch_pricing.py app/schemas/cloudwatch_cost.py app/services/cloudwatch_cost_engine.py app/services/cloudwatch_pricing.py app/tests/test_cloudwatch_cost_engine.py app/tests/test_migrations.py
          cd ..
          git add backend
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: align migration head and format CloudWatch cost engine'
          git push
