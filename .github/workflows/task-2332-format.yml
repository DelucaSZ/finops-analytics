name: Task 23.32 backend format

on:
  push:
    branches:
      - task/23.32-rds-reservations-dashboard

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/23.32-rds-reservations-dashboard
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Format backend
        run: ruff format backend/app/api/routes/rds_reservations_dashboard.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/api/routes/rds_reservations_dashboard.py
          git commit -m "style(rds): format reservations dashboard API"
          git push origin HEAD:task/23.32-rds-reservations-dashboard
