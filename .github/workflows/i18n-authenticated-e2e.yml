name: Aven i18n Authenticated E2E
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/scripts/e2e-i18n-authenticated.mjs'
      - 'frontend/e2e/i18n/**'
      - 'frontend/app/**'
      - 'frontend/components/**'
      - 'frontend/i18n/**'
      - '.github/workflows/i18n-authenticated-e2e.yml'
permissions:
  contents: read
jobs:
  authenticated-i18n:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:i18n
      - run: npm run lint:i18n:references
      - run: npm test
      - run: npm run build
      - name: Install existing browser driver
        run: npm install --no-save --package-lock=false playwright-core@1.57.0
      - name: Authenticated full E2E, locale switch, functional and visual QA
        run: npm run test:i18n:authenticated
      - name: Upload Chromium results, failures, screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-authenticated-full-e2e
          path: frontend/artifacts/i18n-authenticated/
          if-no-files-found: warn
