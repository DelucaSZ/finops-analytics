name: Task 23.8 roadmap update

on:
  push:
    branches:
      - feat/23-8-oci-pricing-admin

permissions:
  contents: write

jobs:
  append-roadmap:
    if: ${{ !contains(github.event.head_commit.message, 'docs: record Task 23.8') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/23-8-oci-pricing-admin
      - name: Append Task 23.8 documentation
        shell: bash
        run: |
          if grep -q '^## Etapa 23.8 — Administração do Pricing Catalog OCI' docs/implementation-roadmap.md; then
            echo 'Task 23.8 already documented.'
            exit 0
          fi
          echo '' | base64 --decode >> docs/implementation-roadmap.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/implementation-roadmap.md
          git commit -m 'docs: record Task 23.8 pricing administration'
          git push origin HEAD:feat/23-8-oci-pricing-admin
