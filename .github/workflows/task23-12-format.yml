name: Task 23.12 backend format

on:
  push:
    branches: [feat/23-12-manual-finops-flow]
    paths: [.github/workflows/task23-12-format.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/23-12-manual-finops-flow
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.0
      - run: ruff format backend/app/services/finops_ledger.py
      - name: Commit formatting and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/task23-12-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/finops_ledger.py .github/workflows/task23-12-format.yml
          git commit -m "style(finops): format manual ledger service"
          git push origin HEAD:feat/23-12-manual-finops-flow
