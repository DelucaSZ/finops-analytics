name: Task 24.1 ACME renewal fix

on:
  push:
    branches:
      - task/24.1-https-tls-chain-diagnostics

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/24.1-https-tls-chain-diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'ruff==0.17.1'
      - name: Patch automatic certificate renewal handling
        run: |
          python - <<'PY'
          from pathlib import Path

          manager_path = Path("backend/app/services/tls_manager.py")
          content = manager_path.read_text()

          replacements = [
              (
                  '        expected = (state.get("certificate") or {}).get("fingerprint_sha256")\n',
                  '        saved_fingerprint = (state.get("certificate") or {}).get("fingerprint_sha256")\n'
                  '        probe_fingerprint = saved_fingerprint if state["mode"] == "custom" else None\n',
              ),
              (
                  '                local_tls = self._probe(domain, timeout=4, expected_fingerprint=expected)\n',
                  '                local_tls = self._probe(domain, timeout=4, expected_fingerprint=probe_fingerprint)\n',
              ),
              (
                  '        if not expected and local_tls.get("certificate"):\n'
                  '            expected = local_tls["certificate"].get("fingerprint_sha256")\n',
                  '        current_fingerprint = (local_tls.get("certificate") or {}).get(\n'
                  '            "fingerprint_sha256"\n'
                  '        )\n'
                  '        expected = current_fingerprint or saved_fingerprint\n',
              ),
          ]
          for old, new in replacements:
              if old not in content:
                  raise SystemExit(f"manager patch target not found: {old!r}")
              content = content.replace(old, new, 1)
          manager_path.write_text(content)

          test_path = Path("backend/app/tests/test_tls.py")
          tests = test_path.read_text()
          old = (
              '    monkeypatch.setattr(\n'
              '        manager,\n'
              '        "_probe",\n'
              '        lambda *_args, **_kwargs: local_tls("NEW"),\n'
              '    )\n'
              '    status = manager.status()\n'
              '    assert status["certificate"]["fingerprint_sha256"] == "NEW"\n'
              '    assert status["mode"] == "automatic"\n'
          )
          new = (
              '    probe_fingerprints = []\n\n'
              '    def renewed_probe(*_args, **kwargs):\n'
              '        probe_fingerprints.append(kwargs.get("expected_fingerprint"))\n'
              '        return local_tls("NEW")\n\n'
              '    monkeypatch.setattr(manager, "_probe", renewed_probe)\n'
              '    status = manager.status()\n'
              '    assert status["certificate"]["fingerprint_sha256"] == "NEW"\n'
              '    assert status["mode"] == "automatic"\n'
              '    assert probe_fingerprints == [None]\n'
          )
          if old not in tests:
              raise SystemExit("automatic renewal test block not found")
          test_path.write_text(tests.replace(old, new, 1))
          PY
      - name: Format patched files
        run: ruff format backend/app/services/tls_manager.py backend/app/tests/test_tls.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/services/tls_manager.py backend/app/tests/test_tls.py
          git diff --cached --check
          git commit -m 'Task 24.1: allow automatic TLS certificate renewal'
          git push origin HEAD:task/24.1-https-tls-chain-diagnostics
