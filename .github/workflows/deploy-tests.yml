name: Auto deploy tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash -n scripts/install-auto-deploy.sh
      - run: python -m unittest discover -s scripts/tests -v
