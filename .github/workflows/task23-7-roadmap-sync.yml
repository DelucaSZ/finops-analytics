name: Task 23.7 roadmap sync

on:
  push:
    branches:
      - feat/23-7-oci-pricing-catalog
    paths:
      - .github/workflows/task23-7-roadmap-sync.yml

permissions:
  contents: write

jobs:
  sync-roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/23-7-oci-pricing-catalog
          fetch-depth: 0

      - name: Append Task 23.7 roadmap entry
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^## Etapa 23.7 — Pricing Catalog persistente para OCI$' docs/implementation-roadmap.md; then
            cat >> docs/implementation-roadmap.md <<'EOF'

## Etapa 23.7 — Pricing Catalog persistente para OCI

**Status:** implementada em branch dedicada, pendente de merge explícito.

### Motivação e arquitetura

Antes desta etapa, as tarifas OCI aprovadas estavam incorporadas ao backend em estruturas estáticas do serviço de pricing. Isso preservava os cálculos, mas tornava manutenção operacional, vigência e evolução do catálogo dependentes de alteração de código e deploy.

A Etapa 23.7 introduz `pricing_catalog_items` como fonte de verdade persistente e provider-neutral para preços unitários de cloud. O fluxo passa a ser `Pricing Catalog (PostgreSQL) -> PricingResolver/PricingSnapshot -> OciPricingService -> cálculos OCI`. A abstração aceita outros providers sem assumir moeda global, embora apenas o pricing OCI seja migrado nesta etapa.

### Modelo persistente

Cada item representa um preço unitário e persiste `provider`, `service`, `sku`, `description`, `unit`, `price`, `currency`, `effective_from`, `effective_until`, `enabled`, `source`, `created_at` e `updated_at`. O campo `price` utiliza `Numeric(20, 8)`/`Decimal`, sem `float` binário. O catálogo possui constraints para preço não negativo, código de moeda explícito em três letras maiúsculas, intervalo temporal válido e identidade única por provider/service/SKU/unit/effective_from, além de índice de lookup por identidade, enabled e vigência.

Os SKUs são chaves determinísticas de lookup, não descrições humanas. As unidades persistidas distinguem `OCPU_HOUR`, `GB_RAM_HOUR`, `GB_MONTH` e `VPU_GB_MONTH`, preservando as fórmulas existentes.

### Moeda e multi-currency

Os valores OCI anteriormente fornecidos ao projeto estão denominados em **BRL (reais brasileiros)**.

O pricing AWS atualmente utilizado pelo DeepOps está em **USD**. O sistema não assume uma moeda global única e não soma valores de moedas diferentes sem uma camada explícita de conversão, que está fora do escopo desta etapa.

Todos os nove itens OCI seedados possuem `currency = BRL`. O resolver valida a moeda esperada e trata divergência como erro de configuração. AWS continua no mecanismo atual e não foi migrado para este catálogo.

### Seed inicial OCI

A migration `0024_pricing_catalog` cria a tabela, constraints e índice e faz seed determinístico dos nove valores já utilizados pelo DeepOps, com `source = IMPORTED_OCI_CALCULATOR`, `enabled = true`, vigência aberta e `effective_from` explícito. O deploy não depende de cadastro manual nem de API externa.

Itens migrados:

- Compute E3 Flex: OCPU e memória;
- Compute E4 Flex: OCPU e memória;
- Compute E5 Flex: OCPU e memória;
- licença Windows por OCPU/hora;
- Block Volume por GB/mês;
- Block Volume performance por VPU/GB/mês.

### Resolver, vigência e erros

`PricingResolver` resolve somente registros habilitados e vigentes na data de referência (`effective_from <= at` e `effective_until` nulo ou posterior a `at`). A API interna aceita data de referência para permitir reprodução histórica futura. O retorno é um `ResolvedPrice` tipado com identidade, valor, moeda, vigência e source.

Preço ausente gera `PricingNotFoundError`; sobreposição efetiva gera `PricingAmbiguityError`; moeda inesperada gera `PricingCurrencyMismatchError`. Nenhum desses casos é transformado silenciosamente em custo zero e não existe fallback permanente para as antigas tarifas estáticas.

### Integração OCI

`OciPricingService` mantém as fórmulas existentes e passa a resolver os unit prices pelo catálogo persistente. Compute Flex continua decomposto em OCPU e RAM, usa 744 horas/mês e preserva a licença Windows separadamente. Block Volume continua calculando capacidade e VPU com as mesmas unidades e arredondamento decimal. Os três shapes suportados permanecem `VM.Standard.E3.Flex`, `VM.Standard.E4.Flex` e `VM.Standard.E5.Flex`.

As oportunidades OCI continuam persistindo moeda junto ao valor monetário. A agregação financeira existente permanece currency-aware, portanto BRL e USD não são somados implicitamente.

### Caching e performance

O resolver suporta cache por identidade/data e `PricingSnapshot` carrega os preços efetivos de um provider em uma única consulta, evitando um SELECT por recurso em loops de análise. Não foi adicionada infraestrutura externa de cache.

### Migration e testes

A migration parte de `0023_opportunity_retention`, cria `pricing_catalog_items`, aplica constraints/índice e popula o seed OCI em BRL. A cobertura adicionada valida seed, moeda, vigência futura, expiração, disabled, ambiguidade, missing price, mismatch de moeda, coexistência OCI/BRL e AWS/USD, equivalência numérica de Compute e Block Volume, mudança de preço via banco, snapshot sem N+1 e upgrade real de migration em SQLite/PostgreSQL quando disponível.

Também permanecem cobertos os testes existentes de pricing OCI, analyzers, findings e regressões AWS, além de build/testes do frontend e smoke de Compose.

### Limitações deliberadas

A Task 23.7 cria a fonte de verdade persistente; a edição administrativa será implementada na Task 23.8 e o versionamento/auditoria completa na Task 23.9.

Esta etapa não implementa CRUD visual de pricing, conversão cambial, serviço de FX, moeda-base global, migração completa do pricing AWS nem ledger financeiro.
EOF
          fi

          git rm .github/workflows/task23-7-roadmap-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation-roadmap.md
          git commit -m "docs: document Task 23.7 pricing catalog"
          git push origin HEAD:feat/23-7-oci-pricing-catalog
