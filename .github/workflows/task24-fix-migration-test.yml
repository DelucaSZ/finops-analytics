name: Task 24 migration test fix

on:
  push:
    branches:
      - task/24.2-generic-audit-foundation

permissions:
  contents: write

jobs:
  fix-migration-head-expectation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/24.2-generic-audit-foundation
      - name: Update stale migration-head assertion
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '0030_billing_service_default' backend/app/tests/test_migrations.py; then
            exit 0
          fi
          sed -i 's/0030_billing_service_default/0031_audit_events/g' backend/app/tests/test_migrations.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/tests/test_migrations.py
          git commit -m 'test: expect audit migration head'
          git push origin HEAD:task/24.2-generic-audit-foundation
