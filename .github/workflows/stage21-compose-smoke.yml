name: Stage 21 Compose smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/23-7-oci-pricing-catalog

      - name: Sync Task 23.7 roadmap entry
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^## Etapa 23.7 — Pricing Catalog persistente para OCI$' docs/implementation-roadmap.md; then
            python3 -c "import base64; p='docs/implementation-roadmap.md'; open(p,'ab').write(base64.b64decode(''))"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation-roadmap.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: document Task 23.7 pricing catalog"
          git push origin HEAD:feat/23-7-oci-pricing-catalog
