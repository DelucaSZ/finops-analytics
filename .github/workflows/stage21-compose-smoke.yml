name: Stage 21 Compose smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/23-7-oci-pricing-catalog
          fetch-depth: 2

      - name: Sync Task 23.7 migration-head assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for filename in (
              "backend/app/tests/test_migrations.py",
              "backend/app/tests/test_opportunity_migration.py",
          ):
              path = Path(filename)
              text = path.read_text()
              old = '== "0023_opportunity_retention"'
              new = '== "0024_pricing_catalog"'
              if old not in text:
                  raise SystemExit(f"expected stale migration assertion not found in {filename}")
              path.write_text(text.replace(old, new))
          PY

          # Restore the permanent full smoke workflow from the parent commit.
          git checkout HEAD^ -- .github/workflows/stage21-compose-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/tests/test_migrations.py backend/app/tests/test_opportunity_migration.py .github/workflows/stage21-compose-smoke.yml
          git commit -m "test: update migration head expectations for pricing catalog"
          git push origin HEAD:feat/23-7-oci-pricing-catalog
