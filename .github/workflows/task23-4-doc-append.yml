name: Task 23.4 roadmap append

on:
  push:
    branches:
      - feat/23-4-opportunity-archiving

permissions:
  contents: write

jobs:
  append-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/23-4-opportunity-archiving
          fetch-depth: 1
      - name: Append Task 23.4 documentation
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^## Etapa 23\.4 — Modelo de arquivamento de oportunidades$' docs/implementation-roadmap.md; then
            printf '%s' '' | base64 --decode >> docs/implementation-roadmap.md
          fi
          rm -f .github/workflows/task23-4-doc-append.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/implementation-roadmap.md .github/workflows/task23-4-doc-append.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: document Task 23.4 archiving model'
          git push origin HEAD:feat/23-4-opportunity-archiving
