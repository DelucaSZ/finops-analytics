name: Task 24.13 retention default test fixer

on:
  push:
    branches:
      - task/24.13-phase24-hardening

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/24.13-phase24-hardening
      - name: Align stale retention default assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/app/tests/test_opportunity_retention.py')
          text = path.read_text()
          old = '    assert configured.opportunity_retention_treated_days == 60\n'
          new = '    assert configured.opportunity_retention_treated_days == 30\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale default assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit regression test alignment
        run: |
          if git diff --quiet -- backend/app/tests/test_opportunity_retention.py; then
            echo 'No change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/tests/test_opportunity_retention.py
          git commit -m 'test: align retention default with persisted policy'
          git push origin HEAD:task/24.13-phase24-hardening
