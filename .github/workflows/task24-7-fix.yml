name: Task 24.7 formatter fix

on:
  push:
    branches:
      - task-24.7-opportunity-management-policy

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-24.7-opportunity-management-policy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply validation fixes
        run: |
          set -euo pipefail
          sed -i 's/Revision ID: 0033_opportunity_management_policy/Revision ID: 0033_opportunity_policy/' backend/app/migrations/versions/0033_opportunity_management_policy.py
          sed -i 's/revision = "0033_opportunity_management_policy"/revision = "0033_opportunity_policy"/' backend/app/migrations/versions/0033_opportunity_management_policy.py
          sed -i 's/== "0032_opportunity_history_cycles"/== "0033_opportunity_policy"/' backend/app/tests/test_migrations.py
          sed -i 's/== "0032_opportunity_history_cycles"/== "0033_opportunity_policy"/' backend/app/tests/test_opportunity_migration.py
          python -c "from pathlib import Path; p=Path('backend/app/tests/test_opportunity_management_policy.py'); s=p.read_text(); s=s.replace('assert (same.period_start, same.period_end) == original', 'assert (same.period_start.replace(tzinfo=UTC), same.period_end.replace(tzinfo=UTC)) == original'); p.write_text(s)"
          python -c "from pathlib import Path; p=Path('backend/app/tests/test_opportunity_retention.py'); s=p.read_text(); s=s.replace('def test_runtime_cycle_runs_retention_before_collection(monkeypatch):', 'def test_runtime_cycle_runs_collection_before_retention(monkeypatch):'); s=s.replace('assert calls == [\"retention\", \"collection\"]', 'assert calls == [\"collection\", \"retention\"]'); p.write_text(s)"
          pip install -r backend/requirements-dev.txt
          cd backend
          ruff format .
          ruff check .
      - name: Commit generated fixes
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend
          git commit -m 'fix: validate task 24.7 migration and tests'
          git push origin HEAD:task-24.7-opportunity-management-policy
      - name: Run backend tests
        working-directory: backend
        run: pytest -q
