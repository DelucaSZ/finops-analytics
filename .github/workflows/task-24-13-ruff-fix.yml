name: Task 24.13 Ruff fixer

on:
  push:
    branches:
      - task/24.13-phase24-hardening

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/24.13-phase24-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Apply Ruff formatter and safe fixes
        run: |
          ruff check . --fix
          ruff format .
      - name: Commit formatting changes
        run: |
          cd ..
          if git diff --quiet; then
            echo 'No Ruff changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend
          git commit -m 'style: normalize Phase 24 backend with Ruff'
          git push origin HEAD:task/24.13-phase24-hardening
