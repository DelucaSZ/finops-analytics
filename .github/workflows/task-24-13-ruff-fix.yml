name: Task 24.13 Ruff fixer

on:
  push:
    branches:
      - task/24.13-phase24-hardening

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/24.13-phase24-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Apply targeted Phase 24 Ruff formatting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/services/opportunity_run_comparison.py')
          text = path.read_text()
          old = '                "Os detalhes desta comparação não estão mais disponíveis devido à política de retenção.",'
          new = '''                (\n                    "Os detalhes desta comparação não estão mais disponíveis "\n                    "devido à política de retenção."\n                ),'''
          if old not in text:
              raise SystemExit('Expected long comparison-context message was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          ruff format app/api/routes/opportunities.py app/services/opportunity_run_comparison.py
          ruff check .
          ruff format --check .
      - name: Commit targeted formatting changes
        run: |
          cd ..
          if git diff --quiet -- backend/app/api/routes/opportunities.py backend/app/services/opportunity_run_comparison.py; then
            echo 'No targeted Ruff changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/api/routes/opportunities.py backend/app/services/opportunity_run_comparison.py
          git commit -m 'style: normalize Task 24.12 backend with Ruff'
          git push origin HEAD:task/24.13-phase24-hardening
