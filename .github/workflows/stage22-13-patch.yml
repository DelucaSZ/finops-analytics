name: Stage 22.13 patch

on:
  push:
    branches: [stage22-13-cloud-account-scheduling]
    paths: [.github/workflows/stage22-13-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage22-13-cloud-account-scheduling
      - name: Apply targeted replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('frontend/app/settings/accounts/page.tsx')
          text = page.read_text()
          old = '''function scheduleSummary(account: CloudAccount, capabilities?: ProviderCapabilities) {
            if (!capabilities?.scheduling) return "Não implementado";
            const aws = account.aws_configuration;
            if (!aws) return "Indisponível";
            return aws.schedule_enabled ? "A cada " + aws.scan_interval_hours + "h" : "Desativado";
          }'''
          new = '''function scheduleSummary(account: CloudAccount, capabilities?: ProviderCapabilities) {
            if (!capabilities?.scheduling) return "Não implementado";
            return account.schedule_enabled
              ? "A cada " + account.scan_interval_hours + "h"
              : "Desativado";
          }'''
          if old not in text:
              raise SystemExit('scheduleSummary source block not found')
          page.write_text(text.replace(old, new, 1))

          roadmap = Path('docs/implementation-roadmap.md')
          text = roadmap.read_text()
          heading = '## Atividade 22.13 — Generalização do scheduling para CloudAccount'
          if heading not in text:
              text = text.rstrip() + '''

---

## Atividade 22.13 — Generalização do scheduling para CloudAccount

**Status:** implementada na branch `stage22-13-cloud-account-scheduling` e proposta no PR #43.

### Fonte de verdade e migration

- `CloudAccount` é a fonte autoritativa para `schedule_enabled`, `scan_interval_hours` e `next_scan_at`.
- A migration `0018_cloud_account_scheduling` faz backfill exato dos schedules AWS existentes, sem recalcular `next_scan_at`, e valida a integridade antes de concluir.
- Contas OCI e providers sem scheduling operacional recebem defaults seguros: schedule desabilitado, intervalo estrutural padrão e `next_scan_at` nulo.
- As colunas de schedule em `AwsAccount` permanecem temporariamente como espelhos de compatibilidade; writes do contrato legado são mapeados para `CloudAccount`, evitando duas fontes de verdade.
- O downgrade copia os valores autoritativos atuais de volta para `AwsAccount` antes de remover os campos comuns.

### Scheduler provider-neutral

- `enqueue_due_scans` seleciona `CloudAccount` habilitada, com schedule habilitado e vencido, e aplica `ProviderCapabilities.scheduling` como gate operacional.
- AWS permanece com `scheduling=true`; OCI permanece com `scheduling=false`. Mesmo um schedule OCI forçado no banco não cria Scan.
- Scheduled scans preservam `trigger=scheduled`, `cloud_account_id` e o `account_id` legado AWS quando aplicável.
- A proteção contra scans `pending`/`running` continua baseada em `cloud_account_id`.
- Criação do Scan e avanço de `CloudAccount.next_scan_at` permanecem na mesma transação.

### API e frontend

- `CloudAccountRead` expõe os três campos de scheduling de forma provider-neutral.
- O contrato AWS legado de create/update continua aceito por compatibilidade e é mapeado para a fonte comum.
- O formulário AWS continua com checkbox e intervalos existentes; reload e resumo passam a ler os campos comuns.
- O resumo verifica a capability antes do estado do schedule, mantendo OCI como `Não implementado`.
- Nenhum controle de recorrência OCI foi adicionado.

### Limites deliberados

- OCI continua com `manual_collection=true` e `scheduling=false`.
- Nenhum Scan OCI scheduled é criado nesta atividade.
- A coleta manual AWS/OCI permanece independente do schedule.
- Não foram adicionados CRON, timezone por schedule, múltiplos schedules, hora do dia ou dias da semana.
- Collectors, analyzers e regras FinOps não foram alterados para habilitar scheduling OCI.

### Próxima atividade

**22.14 — Habilitação do scheduler OCI**, reutilizando esta infraestrutura provider-neutral e a mesma fila/pipeline, sem criar scheduler paralelo.
'''
              roadmap.write_text(text)
          PY
      - name: Commit targeted changes
        run: |
          git rm .github/workflows/stage22-13-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/app/settings/accounts/page.tsx docs/implementation-roadmap.md
          git commit -m 'Document CloudAccount scheduling and use common schedule summary'
          git push origin HEAD:stage22-13-cloud-account-scheduling
