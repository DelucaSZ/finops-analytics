name: Task 23.3 maintenance

on:
  push:
    branches:
      - feat/23-3-opportunity-presence-history
    paths:
      - .github/task23-3-maintenance-trigger

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/23-3-opportunity-presence-history
          fetch-depth: 0

      - name: Apply scoped Task 23.3 maintenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          reconciliation = Path("backend/app/services/opportunity_reconciliation.py")
          text = reconciliation.read_text()
          text = text.replace(
              "            collection_scope_execution_id=(scope_execution.id if scope_execution is not None else None),",
              """            collection_scope_execution_id=(
                  scope_execution.id if scope_execution is not None else None
              ),""",
          )
          text = text.replace(
              '            raise RuntimeError("Presence reactivation requires an attached Finding for audit history")',
              """            raise RuntimeError(
                  "Presence reactivation requires an attached Finding for audit history"
              )""",
          )
          reconciliation.write_text(text)

          migrations_test = Path("backend/app/tests/test_migrations.py")
          text = migrations_test.read_text()
          text = text.replace(
              "    wait_for_database(migration_engine, timeout=0)\n\ndef test_one_time_reset_is_atomic_under_concurrency",
              "    wait_for_database(migration_engine, timeout=0)\n\n\ndef test_one_time_reset_is_atomic_under_concurrency",
          )
          migrations_test.write_text(text)

          roadmap = Path("docs/implementation-roadmap.md")
          roadmap_text = roadmap.read_text()
          marker = "## Etapa 23.3 — Histórico auditável do lifecycle técnico das oportunidades"
          if marker not in roadmap_text:
              section = Path(".github/task23-3-roadmap-section.md").read_text().strip()
              roadmap.write_text(roadmap_text.rstrip() + "\n\n\n" + section + "\n")
          PY

          python3 -m pip install --quiet ruff==0.16.10
          (cd backend && ruff check . --fix && ruff format .)
          git diff --check

      - name: Commit scoped maintenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend docs/implementation-roadmap.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: complete task 23.3 audit history"
          git push origin HEAD:feat/23-3-opportunity-presence-history
