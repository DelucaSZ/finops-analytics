name: Stage 22.13 smoke head fix

on:
  push:
    branches:
      - stage22-13-cloud-account-scheduling
    paths:
      - .github/workflows/stage22-13-smoke-head-fix.yml

permissions:
  contents: write

jobs:
  fix-smoke-head:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage22-13-cloud-account-scheduling
      - name: Update expected migration head
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/stage21-compose-smoke.yml')
          text = path.read_text()
          old = '0017_oci_manual_collection'
          if text.count(old) != 2:
              raise SystemExit(f'expected 2 old-head assertions, found {text.count(old)}')
          path.write_text(text.replace(old, '0018_cloud_account_scheduling'))
          PY
      - name: Commit CI assertion update
        run: |
          git rm .github/workflows/stage22-13-smoke-head-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/stage21-compose-smoke.yml
          git commit -m 'Update compose smoke migration head for stage 22.13'
          git push origin HEAD:stage22-13-cloud-account-scheduling
