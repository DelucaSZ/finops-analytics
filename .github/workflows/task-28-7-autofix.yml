name: Task 28.7 temporary Ruff formatting
on:
  push:
    branches: [feat/task-28.7-aws-policies-regional-pricing]
    paths:
      - .github/workflows/task-28-7-autofix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/task-28.7-aws-policies-regional-pricing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format targeted backend changes
        run: |
          python -m pip install "ruff>=0.9,<1.0"
          cd backend
          ruff check --fix app/services/aws_policy_pricing.py app/services/collection_executors.py app/services/policies.py app/api/routes/policies.py app/tests/test_aws_policy_pricing.py
          ruff format app/services/aws_policy_pricing.py app/services/collection_executors.py app/services/policies.py app/api/routes/policies.py app/tests/test_aws_policy_pricing.py
          ruff check .
          ruff format --check .
      - name: Commit Ruff-only changes to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if ! git diff --cached --quiet; then
            git commit -m "style(28.7): normalize backend formatting with Ruff"
            git push origin HEAD:feat/task-28.7-aws-policies-regional-pricing
          fi
