name: Task 23.17 finalizer

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'feat/23-17-cloudwatch-usage-telemetry' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/23-17-cloudwatch-usage-telemetry
      - name: Apply final cumulative updates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration_test = Path("backend/app/tests/test_migrations.py")
          text = migration_test.read_text()
          old = '== "0027_billing_profiles"'
          new = '== "0028_cloudwatch_usage_telemetry"'
          if old in text:
              migration_test.write_text(text.replace(old, new, 1))

          roadmap = Path("docs/implementation-roadmap.md")
          text = roadmap.read_text()
          marker = "## Etapa 23.17 — Instrumentação de chamadas CloudWatch do DeepOps"
          if marker not in text:
              text += r'''

          ## Etapa 23.17 — Instrumentação de chamadas CloudWatch do DeepOps

          **Status:** implementada na branch `feat/23-17-cloudwatch-usage-telemetry` e publicada em PR dedicado; merge na `main` depende de solicitação explícita posterior.

          ### Objetivo e separação de domínios

          Esta etapa mede uso técnico do CloudWatch realizado pelo DeepOps; ela não calcula custo monetário.

          Billing via Cost Explorer e custo operacional das chamadas CloudWatch do DeepOps são domínios distintos. Nenhum preço, free tier, moeda ou valor de custo foi adicionado nesta etapa. A transformação de usage em custo estimado pertence à 23.18 e o dashboard Usage & Costs pertence à 23.19.

          ### Inventário CloudWatch da implementação atual

          A revisão da `main` confirmou que o DeepOps usa hoje somente `GetMetricStatistics`, centralizado pelo helper `_metric_statistics()` de `collectors.py`:

          - `load_balancer_no_traffic`: `AWS/ApplicationELB/RequestCount`, `AWS/NetworkELB/ProcessedBytes` e `AWS/ELB/RequestCount`;
          - `rds_nonprod_idle`: `AWS/RDS/CPUUtilization` e `AWS/RDS/DatabaseConnections`.

          Não foram encontrados usos atuais de `GetMetricData`, `ListMetrics` ou CloudWatch Logs APIs. Collectors sem CloudWatch e o pipeline OCI não produzem eventos de CloudWatch.

          ### Documentação AWS e unidade técnica

          Foram consultadas a documentação atual de custos/usage do Amazon CloudWatch e as referências das APIs `GetMetricStatistics`, `GetMetricData` e `ListMetrics`. `GetMetricStatistics` e `ListMetrics` são reportadas no usage type de API requests, enquanto `GetMetricData` utiliza `GMD-Metrics` e possui semântica de cobrança distinta. `GetMetricStatistics` consulta uma única métrica e não possui paginação por `NextToken`; `GetMetricData` aceita batches de `MetricDataQueries` e é paginado.

          Uma chamada SDK não é assumida automaticamente como uma unidade faturável. A telemetria foi modelada com base na semântica atual de cobrança das operações CloudWatch utilizadas pelo projeto e preserva contagens adicionais para operações de batch quando aplicáveis.

          ### Arquitetura de instrumentação

          `assume_account_session()` devolve um proxy `InstrumentedAwsSession`. Todos os serviços AWS diferentes de `cloudwatch` são delegados sem alteração; clients CloudWatch são envolvidos por `InstrumentedCloudWatchClient`, que registra a chamada e devolve a resposta sem alterar sua semântica ou relança a exceção original.

          Eventos são mantidos em buffer process-local do worker e inseridos em batch no próximo commit SQLAlchemy. O insert usa savepoint próprio: falha secundária de telemetry storage gera warning agregado e não deve abortar a coleta principal. Não existe um commit por request CloudWatch.

          ### Modelo e atribuição

          A migration `0028_cloudwatch_usage_telemetry` cria `cloudwatch_usage_events`. O modelo persiste timestamp UTC-aware, provider/serviço, `cloud_account_id`, AWS Account ID, região, operação, collector/analyzer quando factuais, `collection_run_id`, request/retry counts, indicador de exatidão, contagens de métricas/queries, success, error type, duração, AWS RequestId e metadata whitelisted.

          `cloud_account_id` e `collection_run_id` usam `ON DELETE SET NULL`, preservando o histórico. O CollectionRun é correlacionado pela conta e janela temporal da chamada; chamadas fora de run permanecem sem vínculo em vez de criar execução artificial.

          Na implementação atual, namespaces RDS são atribuídos a `rds_nonprod_idle` e namespaces ELB a `load_balancer_no_traffic`. Para operação compartilhada ou desconhecida, collector/analyzer permanecem nulos; nenhuma chamada física é duplicada para múltiplos analyzers.

          ### Batching, paginação e retries

          `GetMetricStatistics` registra `metrics_requested=1` e uma row por invocação instrumentada. `GetMetricData`, caso passe a ser usado pelo mesmo client, registra total de `MetricDataQueries`, MetricStat, expressions, Metrics Insights, `MaxDatapoints`, `ScanBy` e presença de `NextToken`. Cada página realmente executada produz seu próprio evento. `ListMetrics` segue a mesma regra de request/página.

          O botocore continua usando retry adaptativo com `max_attempts=6`. Quando `ResponseMetadata.RetryAttempts` está disponível, a telemetria registra `request_count=1+RetryAttempts`. Falhas de transporte sem essa metadata são marcadas como contagem mínima não exata, evitando fabricar precisão para a 23.18.

          ### Segurança, persistência e performance

          Não são persistidos access keys, secret keys, session tokens, authorization headers, payload completo, dimensões completas de recurso ou resposta completa do CloudWatch. Erros guardam apenas código/tipo estruturado. O modelo usa uma row por request instrumentado, não por datapoint/resource, e preserva raw events sem purge automático nesta etapa.

          Índices suportam as consultas atuais por tempo, CollectionRun e combinações de tempo com conta, operação, região, collector e analyzer. Não foi criada infraestrutura de fila, materialização ou rollup.

          ### API/read models

          Foram criados endpoints administrativos read-only:

          - `GET /api/v1/usage/cloudwatch` — raw events paginados, com filtros por período, conta, região, operação, collector, analyzer, CollectionRun e sucesso;
          - `GET /api/v1/usage/cloudwatch/summary` — agregações no banco por operação, account, região, collector ou analyzer.

          O summary expõe somente grandezas técnicas: events, requests, metric queries, métricas solicitadas e falhas. Não há custo monetário.

          ### Testes e migration

          A cobertura específica valida resposta inalterada, success/failure, código de erro, RequestId, retry count, account/region, atribuição RDS/ELB, ausência de telemetry para clients não-CloudWatch, classificação de `GetMetricData`, páginas como eventos distintos, batch flush, CollectionRun, filtros/paginação e summary SQL.

          A migration cumulativa passa a ter `0028_cloudwatch_usage_telemetry` como head e continua sendo validada por `compare_metadata`, SQLite e PostgreSQL no pipeline. As suítes cumulativas continuam cobrindo collectors AWS, Billing/Cost Explorer, OCI e frontend.

          A documentação detalhada da implementação e da pesquisa AWS está em `docs/task-23-17-cloudwatch-usage-telemetry.md`.

          ### Limitações deixadas para 23.18 e 23.19

          A 23.17 não cria tabela de preços CloudWatch, não calcula USD/BRL, não aplica free tier, não calcula estimated operational cost e não cria dashboard. A 23.18 aplicará pricing à telemetria observada; a 23.19 consumirá esse domínio para visualização. Fluxo, Opportunities, Billing/Cost Explorer e OCI Pricing permanecem independentes.
          '''
              roadmap.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/tests/test_migrations.py docs/implementation-roadmap.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: finalize Task 23.17 roadmap and migration head"
            git push origin HEAD:feat/23-17-cloudwatch-usage-telemetry
          fi
