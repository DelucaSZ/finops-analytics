name: Task 23.2 global scope fix

on:
  push:
    branches:
      - feat/23-2-opportunity-absence-reconciliation

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/23-2-opportunity-absence-reconciliation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add regression test and format
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          encoded = ""
          Path("backend/app/tests/test_opportunity_global_scope_reconciliation.py").write_bytes(
              base64.b64decode(encoded)
          )
          PY
          python -m pip install 'ruff>=0.9,<1.0'
          cd backend
          ruff format app/services/opportunity_reconciliation.py app/tests/test_opportunity_global_scope_reconciliation.py
          ruff check --fix app/services/opportunity_reconciliation.py app/tests/test_opportunity_global_scope_reconciliation.py
      - name: Commit final source and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task23-2-global-scope-fix.yml
          git add backend/app/services/opportunity_reconciliation.py backend/app/tests/test_opportunity_global_scope_reconciliation.py
          git commit -m "fix: cover global collector reconciliation scope"
          git push origin HEAD:feat/23-2-opportunity-absence-reconciliation
