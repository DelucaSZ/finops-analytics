name: Temporary Task 28.4 formatting (branch only)
on:
  push:
    branches:
      - feat/task-28.4-aws-pricing-sync-monitoring
    paths:
      - .github/workflows/aven-pricing-sync-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: python -m pip install ruff==0.14.6
      - name: Format and lint updated backend
        run: |
          cd backend
          ruff check --fix .
          ruff format .
      - name: Commit only formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if ! git diff --cached --quiet; then
            git commit -m "style(pricing): normalize backend lint and formatting"
            git push origin HEAD:feat/task-28.4-aws-pricing-sync-monitoring
          fi
