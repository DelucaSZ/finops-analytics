name: Task 24.13 runtime dependency updater

on:
  push:
    branches:
      - task/24.13-phase24-hardening

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/24.13-phase24-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Apply non-breaking runtime audit fixes
        run: |
          npm audit fix --omit=dev || true
          npm install
      - name: Validate no critical runtime advisory and frontend
        run: |
          npm audit --omit=dev --audit-level=critical
          npm test
          npm run lint
          npm run build
      - name: Commit dependency lock update
        run: |
          cd ..
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo 'No runtime dependency changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json
          git commit -m 'fix: update vulnerable frontend runtime dependencies'
          git push origin HEAD:task/24.13-phase24-hardening
