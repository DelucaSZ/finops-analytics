name: Task 23.15 repository patch

on:
  push:
    branches:
      - feat/23-15-billing-profiles

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update migration assertion and roadmap
        run: |
          python - <<'PY'
          from pathlib import Path

          migration_test = Path("backend/app/tests/test_migrations.py")
          text = migration_test.read_text()
          old = '== "0026_finops_ledger"'
          new = '== "0027_billing_profiles"'
          if old not in text and new not in text:
              raise SystemExit("expected migration revision assertion not found")
          migration_test.write_text(text.replace(old, new, 1))

          roadmap = Path("docs/implementation-roadmap.md")
          text = roadmap.read_text()
          marker = "## Etapa 23.15 — Perfis e presets de AWS Billing"
          if marker not in text:
              section = Path("docs/task-23-15-section.md").read_text().strip()
              roadmap.write_text(text.rstrip() + "\n\n" + section + "\n")
          PY
      - name: Commit updates and remove one-shot helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task-23-15-repo-patch.yml docs/task-23-15-section.md
          git add backend/app/tests/test_migrations.py docs/implementation-roadmap.md
          git commit -m "docs: record Task 23.15 billing profiles"
          git push
