name: Task 23.5 finalize branch

on:
  push:
    branches:
      - feat/23-5-opportunity-retention-policy

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/23-5-opportunity-retention-policy
          fetch-depth: 0
      - name: Finalize roadmap and migration test
        run: |
          python - <<'PY'
          from pathlib import Path

          migrations = Path("backend/app/tests/test_migrations.py")
          text = migrations.read_text()
          old = '    with migration_engine.connect() as connection:\n        assert MigrationContext.configure(connection).get_current_revision() == "0002_users"\n'
          new = '    with migration_engine.begin() as connection:\n        assert MigrationContext.configure(connection).get_current_revision() == "0002_users"\n'
          if old in text:
              migrations.write_text(text.replace(old, new, 1))

          roadmap = Path("docs/implementation-roadmap.md")
          section = Path(".task235-roadmap-section.md").read_text().strip()
          text = roadmap.read_text().rstrip()
          if section.splitlines()[0] not in text:
              roadmap.write_text(text + "\n\n" + section + "\n")
          PY
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/tests/test_migrations.py docs/implementation-roadmap.md
          git commit -m "docs(23.5): finalize retention roadmap"
          git push origin HEAD:feat/23-5-opportunity-retention-policy
