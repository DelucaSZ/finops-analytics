name: Task 23.18 final validation fixes

on:
  push:
    branches: [feat/23-18-cloudwatch-cost-engine]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final validation fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          migration_test = Path('backend/app/tests/test_opportunity_migration.py')
          text = migration_test.read_text()
          old = '== "0028_cloudwatch_usage_telemetry"'
          new = '== "0029_cloudwatch_cost_engine"'
          if old not in text and new not in text:
              raise SystemExit('expected opportunity migration head assertion not found')
          migration_test.write_text(text.replace(old, new, 1))

          engine = Path('backend/app/services/cloudwatch_cost_engine.py')
          text = engine.read_text()
          old_coverage = '''    for rule in rules:\n        if rule.operation not in CLOUDWATCH_PRICING_DIMENSIONS:\n            continue\n        clause = and_(\n'''
          new_coverage = '''    for rule in rules:\n        dimension = CLOUDWATCH_PRICING_DIMENSIONS.get(rule.operation)\n        if dimension is None or dimension.name != rule.pricing_dimension:\n            continue\n        clause = and_(\n'''
          if old_coverage not in text and new_coverage not in text:
              raise SystemExit('expected coverage block not found')
          text = text.replace(old_coverage, new_coverage, 1)

          old_group = '''                group_value = (\n                    str(row.cost_group)\n                    if group_by is not None and row.cost_group is not None\n                    else None\n                )\n'''
          new_group = '''                if group_by == "analyzer" and row.cost_group is None:\n                    group_value = "Shared / Unattributed"\n                else:\n                    group_value = (\n                        str(row.cost_group)\n                        if group_by is not None and row.cost_group is not None\n                        else None\n                    )\n'''
          if old_group not in text and new_group not in text:
              raise SystemExit('expected group attribution block not found')
          engine.write_text(text.replace(old_group, new_group, 1))
          PY
          git add backend/app/tests/test_opportunity_migration.py backend/app/services/cloudwatch_cost_engine.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: finalize CloudWatch cost coverage semantics'
          git push
