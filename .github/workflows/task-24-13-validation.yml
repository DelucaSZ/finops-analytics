name: Task 24.13 pre-PR validation

on:
  push:
    branches:
      - task/24.13-phase24-hardening

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: deepops_test
          POSTGRES_USER: deepops_test
          POSTGRES_PASSWORD: test-only-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deepops_test -d deepops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://deepops_test:test-only-ci-password@localhost:5432/deepops_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python readiness checker
        run: python3 -m py_compile scripts/check-external-readiness.py
      - name: Validate Compose public exposure
        run: |
          cp .env.example .env
          python3 scripts/check-external-readiness.py --repo "$GITHUB_WORKSPACE" --env-file .env --static-only
      - name: Validate public Security Group template
        run: |
          python3 -m pip install --disable-pip-version-check cfn-lint
          cfn-lint infrastructure/cloudformation/deepops-public-security-group.yaml

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          {
            echo "POSTGRES_DB=nuvemiq"
            echo "POSTGRES_USER=nuvemiq"
            echo "POSTGRES_PASSWORD=task24-ci-postgres-password"
            echo "DATABASE_URL=postgresql+psycopg://nuvemiq:task24-ci-postgres-password@db:5432/nuvemiq"
            echo "NUVEMIQ_ENVIRONMENT=development"
            echo "NUVEMIQ_SECRET_KEY=task24-ci-secret-key-with-at-least-32-characters"
            echo "NUVEMIQ_ADMIN_EMAIL=task24-admin@example.com"
            echo "NUVEMIQ_ADMIN_PASSWORD=Task24-test-password-482!"
            echo "NUVEMIQ_OCI_CREDENTIALS_KEY=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
            echo "NUVEMIQ_OCI_CREDENTIALS_KEY_VERSION=task24-ci"
            echo "NEXT_PUBLIC_API_URL=/api/v1"
          } >> .env
      - name: Validate Compose configuration
        run: docker compose -p deepops-task24 config --quiet
      - name: Build application images
        run: docker compose -p deepops-task24 build
      - name: Start isolated stack
        run: docker compose -p deepops-task24 up -d
      - name: Wait for proxy and API readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1/health >/tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker compose -p deepops-task24 ps
          docker compose -p deepops-task24 logs --no-color
          exit 1
      - name: Verify migrations, proxy routing and frontend
        shell: bash
        run: |
          set -euo pipefail
          version="$(docker compose -p deepops-task24 exec -T db psql -U nuvemiq -d nuvemiq -Atc 'SELECT version_num FROM deepops_mfa_schema_version;')"
          test "$version" = "0034_opportunity_discovery_runs"
          curl --fail --silent --show-error http://127.0.0.1/health | grep -q '"status":"ok"'
          curl --fail --silent --show-error http://127.0.0.1/ >/tmp/frontend.html
          test -s /tmp/frontend.html
      - name: Verify persistence and readiness after restart
        shell: bash
        run: |
          set -euo pipefail
          docker compose -p deepops-task24 restart db api worker web proxy
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1/health >/dev/null; then
              break
            fi
            sleep 2
          done
          version="$(docker compose -p deepops-task24 exec -T db psql -U nuvemiq -d nuvemiq -Atc 'SELECT version_num FROM deepops_mfa_schema_version;')"
          test "$version" = "0034_opportunity_discovery_runs"
          docker compose -p deepops-task24 ps
      - name: Capture stack logs
        if: always()
        run: docker compose -p deepops-task24 logs --no-color > task24-compose.log 2>&1 || true
      - name: Upload stack logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task24-compose-logs
          path: task24-compose.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down isolated stack
        if: always()
        run: docker compose -p deepops-task24 down -v --remove-orphans
