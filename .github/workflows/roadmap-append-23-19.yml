name: Append 23.19 roadmap entry

on:
  push:
    branches:
      - feat/23-19-deepops-usage-cost-dashboard
    paths:
      - .github/workflows/roadmap-append-23-19.yml

permissions:
  contents: write

jobs:
  append-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/23-19-deepops-usage-cost-dashboard
          fetch-depth: 0
      - name: Append Stage 23.19 documentation
        shell: python
        run: |
          from pathlib import Path

          path = Path("docs/implementation-roadmap.md")
          marker = "## Etapa 23.19 — Dashboard de Usage & Costs do DeepOps"
          if marker in path.read_text(encoding="utf-8"):
              raise SystemExit(0)

          section = r'''


## Etapa 23.19 — Dashboard de Usage & Costs do DeepOps

**Status:** implementada na branch `feat/23-19-deepops-usage-cost-dashboard` e publicada no PR #73; merge na `main` depende de solicitação explícita posterior.

### Objetivo, localização e separação de domínios

A Etapa 23.19 fecha o bloco de custo operacional do próprio DeepOps iniciado pelas Etapas 23.17 e 23.18. A área foi adicionada dentro de `Configurações → Uso e custos`, na rota `/settings/usage-costs`, sem criar nova entrada principal na sidebar. O acesso segue o padrão administrativo de Configurações e os endpoints de telemetry/cost permanecem protegidos por `require_admin`.

> o dashboard apresenta uma estimativa do custo CloudWatch gerado pelo próprio DeepOps, e não o custo total de CloudWatch da conta AWS nem a fatura final da AWS.

> por padrão, o valor apresentado é a estimativa bruta calculada pela Task 23.18 e não desconta free tier compartilhado quando o DeepOps não possui visibilidade completa sobre o consumo da conta.

> o frontend não reproduz fórmulas de pricing; todos os valores monetários são calculados pelo CloudWatch Cost Engine.

> Billing via Cost Explorer e Usage & Costs do DeepOps são domínios independentes.

> nenhuma conversão cambial é realizada.

Fluxo/ledger, Opportunities, Billing/Cost Explorer e Pricing OCI permanecem independentes. A página não cria movimentação financeira, não consulta Cost Explorer e não calcula ROI global.

### Arquitetura e read models

A interface consome diretamente a telemetria factual da 23.17 e os valores monetários calculados pela 23.18:

- `GET /api/v1/usage/cloudwatch/summary` para events, requests, metric queries, métricas solicitadas e falhas;
- `GET /api/v1/deepops-costs/cloudwatch/summary` para `gross_estimated_cost`, currencies, completeness, unpriced usage, free-tier assumption e provenance;
- `GET /api/v1/deepops-costs/cloudwatch/timeseries` para evolução diária/mensal;
- `GET /api/v1/deepops-costs/cloudwatch/breakdown` para account, operation, collector, analyzer e CollectionRun;
- `GET /api/v1/cloud-accounts` para nomes amigáveis de contas;
- `GET /api/v1/collections` para metadata de CollectionRun.

A única extensão técnica necessária no backend foi permitir `group_by=collection_run` no summary de usage, evitando carregar raw events ou executar N+1 por execução. O filtro especial de analyzer compartilhado é traduzido server-side para `analyzer IS NULL`; nenhum identificador artificial é persistido.

Não foi criado endpoint composto, tabela materializada, migration ou índice novo. As agregações continuam no banco/Cost Engine; o browser recebe read models agregados.

### Filtros e período

O período padrão é **Este mês**. Também existem Hoje, Últimos 7 dias, Mês anterior, Últimos 3 meses e intervalo personalizado. A UI converte a seleção para `date_from/date_to` com limite superior exclusivo, aplicado ao `occurred_at` factual da telemetria.

Filtros globais: conta AWS, região, operação, collector e analyzer. Operações, regiões, collectors e analyzers são derivados dos valores realmente presentes na telemetria do período; não existe catálogo frontend separado. Analyzer inclui `Compartilhado / não atribuído` quando há attribution nula. Todos os blocos utilizam os mesmos filtros canônicos, salvo a própria dimensão agrupada pelo backend.

### KPIs, uso e gross estimate

A visão inicial mantém quatro KPIs: **Custo estimado do DeepOps**, **Requests CloudWatch**, **Metric queries** e **Falhas**. O KPI monetário usa exatamente o `gross_estimated_cost` retornado pelo Cost Engine. Requests e metric queries permanecem grandezas separadas; a UI não cria uma unidade faturável genérica nem soma dimensões técnicas incompatíveis.

A seção de uso técnico também mostra events e métricas solicitadas. Usage continua visível mesmo se pricing estiver ausente ou a consulta monetária falhar.

### Free tier, pricing source, verified date e completeness

`free_tier_applied` é apresentado como premissa do resultado. Quando `false`, a UI explica que o DeepOps observa somente seu próprio uso e não conhece necessariamente o consumo compartilhado do free tier por outras workloads.

A área **Sobre esta estimativa** mostra a fonte de pricing, `pricing_verified_at`, free-tier assumption, completeness, unpriced usage, quantidade de vigências de pricing efetivamente aplicadas e a política de currency/FX. O breakdown por operação permite abrir provenance read-only com pricing rule, usage quantity, unit price, billing unit, vigência e source; esses dados servem somente para explicabilidade e não são usados para recalcular custo no JavaScript.

`is_complete=false` produz warning explícito e o valor parcial não é apresentado como total definitivo. `unpriced_usage` mostra operação, região, eventos, requests e motivo. Se nenhum custo puder ser estimado, a interface informa que existe usage coletado sem pricing, sem esconder a telemetria.

### Timeseries e breakdowns

A série principal é **Custo estimado ao longo do tempo**. Períodos de até 62 dias usam buckets diários; períodos maiores usam buckets mensais. Cada currency é desenhada separadamente e uma série incompleta recebe warning geral. O projeto não possuía biblioteca de charts; foi usado SVG simples e acessível, sem nova dependência visual.

Breakdowns implementados:

- **por conta**: nome amigável + AWS Account ID, requests, metric queries, falhas, custo e participação dentro da mesma currency;
- **por operação**: custo/usage factual e provenance da regra aplicada;
- **por collector**: attribution factual da telemetria;
- **por analyzer**: attribution factual, sem redistribuição de chamadas compartilhadas.

Percentuais visuais são calculados somente entre itens da mesma currency. Não existe percentual ou total cross-currency.

### Shared attribution e CollectionRun

O Cost Engine continua sendo a fonte da agregação por analyzer. `analyzer=NULL` permanece um único grupo `Shared / Unattributed`, traduzido na UI para `Compartilhado / não atribuído`; o frontend não rateia, duplica ou redistribui requests compartilhados.

A seção **Execuções recentes** combina cost breakdown e usage summary por `collection_run_id` com metadata de `/collections`, mostrando data, conta, status, requests, metric queries e custo estimado por currency, além de link para o detalhe de CollectionRun existente. Uma run `FAILED` pode ter requests e custo; ela nunca é assumida como custo zero. Usage sem `collection_run_id` continua válido e é apresentado como não atribuído a uma execução específica.

### Currency e precisão

Currency é sempre retornada pelo Cost Engine; USD não é hardcoded como moeda da página. Moedas diferentes são exibidas separadamente e nunca somadas. Não existe FX.

A formatação monetária é adaptativa para custos operacionais pequenos: 2 casas para valores usuais e mais casas para frações menores; valores não-zero abaixo da precisão visual usam marcador `<` em vez de serem apresentados como zero. O Decimal original permanece no backend/contrato; conversão numérica no browser é usada somente para formatação, geometria do SVG e participação visual dentro da mesma currency, nunca para `usage × price`.

### Loading, erros, empty state e concorrência

Telemetria, Cost Engine e metadata de CollectionRun possuem loading/error independentes. Falha de pricing não remove usage válido. `is_complete=false` é warning de completude, não erro de transporte. Período sem telemetria produz empty state e explica que dados aparecem após novas coletas instrumentadas; nenhum backfill de chamadas anteriores à 23.17 é inventado.

Mudanças rápidas de filtro usam `AbortController` e sequence id para impedir que resposta stale substitua a seleção atual. O shell de Configurações permanece montado; a página não bloqueia toda a área administrativa durante refetch.

### Authorization e performance

A área é admin-only no frontend e, principalmente, os endpoints de telemetry/cost continuam protegidos no backend. A lista de contas oferecida deriva de `CloudAccount` disponível ao usuário; nenhum bypass de ACL foi criado.

Os gráficos e breakdowns usam agregações SQL/read models. Não existe `GET all usage events`. Metadata de conta é carregada uma vez e CollectionRuns são correlacionadas por ID sobre uma página limitada, sem query por linha. Não foi necessário adicionar migration ou índice especulativo.

### Testes e validação

Foram adicionados testes backend para aggregation de usage por CollectionRun, preservação de runs falhas/usage sem run e filtro `Compartilhado` via `IS NULL`. Helpers frontend cobrem período/default, granularidade, query canônica, unidades técnicas separadas, agrupamento por currency, precisão de small values, labels e múltiplas pricing versions. Testes de navegação validam admin-only e a existência da nova área; testes de contrato da página validam consumo dos read models 23.17/23.18, ausência de Billing/FX/pricing math e proteção contra stale requests.

O CI oficial do PR executa PostgreSQL 17, `ruff check .`, `ruff format --check .`, `pytest -q`, `npm test`, `npm run build`, security, Auto Deploy Tests e Stage 21 Compose smoke. O resultado final deve ser considerado autoritativo no head definitivo do PR.

Documentação detalhada: `docs/task-23-19-deepops-usage-cost-dashboard.md`.

### Limitações deliberadas e próxima etapa

A 23.19 não implementa editor completo de CloudWatch pricing, auto-update/scraper de preços, budgets, anomaly detection, alertas, reconciliação com Cost Explorer, ROI global, FX, export pipeline novo, ledger entries, Opportunities/Findings ou push/realtime. O redesign global de navegação/UX permanece para a Task 23.20.
'''
          with path.open("a", encoding="utf-8", newline="") as handle:
              handle.write(section)
      - name: Commit roadmap entry
        run: |
          if git diff --quiet -- docs/implementation-roadmap.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation-roadmap.md
          git commit -m "docs(23.19): update implementation roadmap"
          git push origin HEAD:feat/23-19-deepops-usage-cost-dashboard
