name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  roadmap:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/23-19-deepops-usage-cost-dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Append Task 23.19 to cumulative roadmap
        shell: python
        run: |
          from pathlib import Path

          roadmap = Path("docs/implementation-roadmap.md")
          marker = "## Etapa 23.19 — Dashboard de Usage & Costs do DeepOps"
          current = roadmap.read_text(encoding="utf-8")
          if marker in current:
              raise SystemExit(0)

          detailed_path = Path("docs/task-23-19-deepops-usage-cost-dashboard.md")
          detailed = detailed_path.read_text(encoding="utf-8")
          first_heading = "# Etapa 23.19 — Dashboard de Usage & Costs do DeepOps"
          if not detailed.startswith(first_heading):
              raise SystemExit("Unexpected Task 23.19 documentation heading")
          body = detailed[len(first_heading):].lstrip()
          section = f"\n\n{marker}\n\n{body}"
          roadmap.write_text(current + section, encoding="utf-8")
      - name: Commit roadmap entry
        run: |
          if git diff --quiet -- docs/implementation-roadmap.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation-roadmap.md
          git commit -m "docs(23.19): update implementation roadmap"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: deepops_test
          POSTGRES_USER: deepops_test
          POSTGRES_PASSWORD: test-only-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deepops_test -d deepops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://deepops_test:test-only-ci-password@localhost:5432/deepops_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python readiness checker
        run: python3 -m py_compile scripts/check-external-readiness.py
      - name: Validate Compose public exposure
        run: |
          cp .env.example .env
          python3 scripts/check-external-readiness.py --repo "$GITHUB_WORKSPACE" --env-file .env --static-only
      - name: Validate public Security Group template
        run: |
          python3 -m pip install --disable-pip-version-check cfn-lint
          cfn-lint infrastructure/cloudformation/deepops-public-security-group.yaml
