name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  finalize-task-23-13:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply one-time finalization
        run: |
          awk "/^          python - <<'PY'$/,/^          PY$/" .github/workflows/task-23-13-finalize.yml \
            | sed '1d;$d;s/^          //' > /tmp/task-23-13-finalize.py
          python /tmp/task-23-13-finalize.py
          python -m pip install --disable-pip-version-check 'ruff==0.17.0'
          cd backend
          ruff check --fix app/api/routes/finops_flow.py app/schemas/finops_flow.py app/services/finops_flow.py app/tests/test_finops_flow.py
          ruff format app/api/routes/finops_flow.py app/schemas/finops_flow.py app/services/finops_flow.py app/tests/test_finops_flow.py
          cd ..
      - name: Commit finalization
        run: |
          if git diff --quiet; then
            echo "No finalization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/flow/page.tsx docs/implementation-roadmap.md backend/app/api/routes/finops_flow.py backend/app/schemas/finops_flow.py backend/app/services/finops_flow.py backend/app/tests/test_finops_flow.py
          git commit -m "docs: finalize Task 23.13 flow semantics"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: deepops_test
          POSTGRES_USER: deepops_test
          POSTGRES_PASSWORD: test-only-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deepops_test -d deepops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://deepops_test:test-only-ci-password@localhost:5432/deepops_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build


  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python readiness checker
        run: python3 -m py_compile scripts/check-external-readiness.py
      - name: Validate Compose public exposure
        run: |
          cp .env.example .env
          python3 scripts/check-external-readiness.py --repo "$GITHUB_WORKSPACE" --env-file .env --static-only
      - name: Validate public Security Group template
        run: |
          python3 -m pip install --disable-pip-version-check cfn-lint
          cfn-lint infrastructure/cloudformation/deepops-public-security-group.yaml
