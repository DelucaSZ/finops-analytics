name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: deepops_test
          POSTGRES_USER: deepops_test
          POSTGRES_PASSWORD: test-only-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deepops_test -d deepops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://deepops_test:test-only-ci-password@localhost:5432/deepops_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
        continue-on-error: true
      - run: npm test
      - run: npm run build
      - name: Validate favicon routes and generated metadata
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 >/tmp/deepops-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ >/tmp/deepops-root.html; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = "true"

          curl --fail --silent --show-error --output /tmp/deepops-favicon.ico http://127.0.0.1:3000/favicon.ico
          curl --fail --silent --show-error --output /tmp/deepops-icon.svg http://127.0.0.1:3000/icon.svg
          test -s /tmp/deepops-favicon.ico
          test -s /tmp/deepops-icon.svg
          grep -q 'favicon.ico' /tmp/deepops-root.html
          grep -q 'icon.svg' /tmp/deepops-root.html


  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python readiness checker
        run: python3 -m py_compile scripts/check-external-readiness.py
      - name: Validate Compose public exposure
        run: |
          cp .env.example .env
          python3 scripts/check-external-readiness.py --repo "$GITHUB_WORKSPACE" --env-file .env --static-only
      - name: Validate public Security Group template
        run: |
          python3 -m pip install --disable-pip-version-check cfn-lint
          cfn-lint infrastructure/cloudformation/deepops-public-security-group.yaml
