name: Task 23.2 source patches

on:
  push:
    branches:
      - feat/23-2-opportunity-absence-reconciliation

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/23-2-opportunity-absence-reconciliation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply narrow source patches
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          migration_test = Path("backend/app/tests/test_migrations.py")
          text = migration_test.read_text()
          text = text.replace(
              '== "0019_opportunity_presence"',
              '== "0020_opportunity_reconciliation"',
              1,
          )
          migration_test.write_text(text)

          query = Path("backend/app/services/opportunity_query.py")
          text = query.read_text()
          old = '        "presence_status": finding.presence_status,\n        "missing_since_at": finding.missing_since_at,\n        "resolved_externally_at": finding.resolved_externally_at,\n'
          new = '        "presence_status": finding.presence_status,\n        "missing_count": finding.missing_count,\n        "missing_since_at": finding.missing_since_at,\n        "resolved_externally_at": finding.resolved_externally_at,\n        "presence_reconciled_at": finding.presence_reconciled_at,\n'
          if old not in text and '"missing_count": finding.missing_count' not in text:
              raise SystemExit("opportunity serializer anchor not found")
          if old in text:
              query.write_text(text.replace(old, new, 1))

          types = Path("frontend/lib/types.ts")
          text = types.read_text()
          old = '  presence_status: OpportunityPresenceStatus;\n  missing_since_at: string | null;\n  resolved_externally_at: string | null;\n'
          new = '  presence_status: OpportunityPresenceStatus;\n  missing_count: number;\n  missing_since_at: string | null;\n  resolved_externally_at: string | null;\n  presence_reconciled_at: string | null;\n'
          if old not in text and "  missing_count: number;" not in text:
              raise SystemExit("frontend finding type anchor not found")
          if old in text:
              types.write_text(text.replace(old, new, 1))

          presence_test = Path("backend/app/tests/test_opportunity_presence.py")
          text = presence_test.read_text()
          text = text.replace(
              '        assert finding.missing_since_at is None\n        assert finding.resolved_externally_at is None\n        assert finding.needs_review is True',
              '        assert finding.missing_count == 0\n        assert finding.missing_since_at is None\n        assert finding.resolved_externally_at is None\n        assert finding.needs_review is True',
              1,
          )
          presence_test.write_text(text)

          roadmap = Path("docs/implementation-roadmap.md")
          text = roadmap.read_text()
          marker = "## Etapa 23.2 — Reconciliação de oportunidades por ausência entre coletas"
          if marker not in text:
              encoded = ""
              section = base64.b64decode(encoded).decode()
              roadmap.write_text(text.rstrip() + "\n" + section.lstrip() + "\n")
          PY
      - name: Format changed Python files
        run: |
          python -m pip install 'ruff>=0.9,<1.0'
          cd backend
          ruff format \
            app/core/config.py \
            app/migrations/versions/0020_opportunity_absence_reconciliation.py \
            app/models/collection_scope_execution.py \
            app/models/finding.py \
            app/schemas/finding.py \
            app/schemas/opportunity.py \
            app/services/opportunity_query.py \
            app/services/opportunity_reconciliation.py \
            app/tests/test_migrations.py \
            app/tests/test_opportunity_presence.py \
            app/tests/test_opportunity_reconciliation.py \
            app/tests/test_opportunity_scope_coverage.py \
            app/worker.py
          ruff check --fix \
            app/core/config.py \
            app/migrations/versions/0020_opportunity_absence_reconciliation.py \
            app/models/collection_scope_execution.py \
            app/models/finding.py \
            app/schemas/finding.py \
            app/schemas/opportunity.py \
            app/services/opportunity_query.py \
            app/services/opportunity_reconciliation.py \
            app/tests/test_migrations.py \
            app/tests/test_opportunity_presence.py \
            app/tests/test_opportunity_reconciliation.py \
            app/tests/test_opportunity_scope_coverage.py \
            app/worker.py
      - name: Commit source patches
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend docs
          git commit -m "chore: finalize task 23.2 contracts and docs"
          git push origin HEAD:feat/23-2-opportunity-absence-reconciliation
