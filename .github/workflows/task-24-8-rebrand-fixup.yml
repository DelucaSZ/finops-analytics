name: Task 24.8 rebrand fixup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'task/24.8-aven-technical-rebrand'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply classified public-brand rewrites
        run: python3 scripts/task-24-8-rebrand-fixup.py
      - name: Commit source rewrites when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source rewrite required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend backend
          git commit -m "Task 24.8 — Rebrand remaining public copy"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
