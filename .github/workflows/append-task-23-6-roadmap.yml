name: Append Task 23.6 roadmap

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  append-roadmap:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/23-6-opportunity-history'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/23-6-opportunity-history
          fetch-depth: 0
      - name: Append Task 23.6 documentation once
        shell: bash
        run: |
          if grep -q '^## Etapa 23\.6 — Histórico e consulta de oportunidades arquivadas$' docs/implementation-roadmap.md; then
            echo 'Task 23.6 roadmap section already present.'
            exit 0
          fi
          cat >> docs/implementation-roadmap.md <<'EOF'


## Etapa 23.6 — Histórico e consulta de oportunidades arquivadas

**Status:** implementada na branch `feat/23-6-opportunity-history` e publicada no PR #60; validação final pelo CI do PR antes de qualquer merge na `main`.

### Objetivo e navegação

A Etapa 23.6 transforma a fundação de arquivamento das Etapas 23.4/23.5 em uma experiência operacional de consulta. A tela de Oportunidades mantém as três abas correntes `Abertas`, `Tratadas` e `Rejeitadas` e adiciona uma quarta aba `Histórico` na mesma rota, controlada por `view=history` na query string.

> a aba Histórico é uma visão de consulta sobre registros preservados; arquivamento não representa exclusão.

As abas operacionais continuam usando o default `archive_state=active`. A aba Histórico usa explicitamente `archive_state=archived`, portanto registros arquivados não poluem o backlog corrente e registros não arquivados não são misturados automaticamente no histórico.

### Filtros, URL e paginação

A visão histórica reutiliza o mesmo sistema de filtros/URL da workspace de Oportunidades e acrescenta dimensões específicas do histórico. Os filtros são aplicados no backend antes da paginação:

- provider;
- conta provider-native;
- status humano `open|treated|rejected`;
- presença técnica `active|missing|resolved_externally`;
- serviço, região, resource type, severidade e regra existentes;
- busca textual existente sobre recurso, título, descrição, regra e serviço;
- período por `archived_at` (`archived_from`/`archived_to`);
- motivo corrente de arquivamento `MANUAL|RETENTION_POLICY`.

A ordenação padrão do Histórico é `archived_at DESC`. A paginação permanece server-side por `page/page_size`; a listagem continua executando count + SELECT limitado e não carrega o dataset completo no navegador. `GET /opportunities/options` passou a aceitar o mesmo `archive_state`, permitindo que providers, contas e dimensões do seletor reflitam corretamente o escopo ativo ou histórico.

O filtro de conta permanece single-select porque essa é a infraestrutura existente da workspace. Multi-select não foi introduzido nesta etapa para evitar um segundo sistema de state/serialização e uma refatoração global desproporcional; o contrato provider-native atual continua preservado.

### Listagem histórica

A tabela reutiliza a workspace atual e prioriza contexto operacional sem criar uma grade paralela. Cada linha histórica apresenta identificação da oportunidade/recurso, provider e conta, região/serviço, status humano, presença técnica, severidade, valor financeiro na moeda persistida, última observação, `archived_at`, motivo do arquivamento e ações de consulta/desarquivamento.

Status humano e presença técnica são badges independentes. Assim, `Tratada` nunca é apresentada como sinônimo de `Resolvida externamente`, e combinações como `open + resolved_externally + archived`, `treated + resolved_externally + archived` e `rejected + active + archived` permanecem representáveis.

A tela histórica não habilita tratar, rejeitar ou reabrir em massa. As ações de lifecycle continuam somente nas abas operacionais. A ação relevante sobre item arquivado é `Desarquivar`.

### Detalhe e históricos

O detalhe direto por ID já aceitava registros arquivados e continua sendo a fonte de drill-down. A Etapa 23.6 amplia a apresentação para diferenciar explicitamente:

- lifecycle humano e seus timestamps/`OpportunityStatusHistory`;
- presença técnica e `OpportunityPresenceHistory`;
- detecções factuais em `OpportunityObservation`;
- arquivamento/desarquivamento em `OpportunityArchiveHistory`.

Foi adotada a alternativa de seções separadas, em vez de criar um endpoint de timeline unificada. Essa escolha reutiliza os contratos auditáveis existentes, evita acoplamento entre fontes com semânticas diferentes e impede duplicação artificial de fatos. O archive history exibe labels humanos para `MANUAL`, `RETENTION_POLICY` e `REAPPEARED`; quando a política automática registrou `threshold_days`, o detalhe explica a janela utilizada sem expor nomes internos de implementação.

Observations continuam carregadas somente no detalhe e paginadas; a listagem não faz uma chamada por oportunidade nem eager-load de histórico.

### Desarquivamento e reaparecimento

A listagem e o detalhe históricos oferecem `Desarquivar` com confirmação. A operação reutiliza `POST /opportunities/{id}/unarchive` da Etapa 23.4 e não envia alteração de lifecycle humano ou presença técnica. Após sucesso, as queries de Oportunidades/Dashboard são invalidadas; o item deixa a lista `archive_state=archived` e volta à aba operacional correspondente ao seu `status` atual.

A proteção de re-arquivamento imediato continua integralmente sob a política da Etapa 23.5. A UI não replica essa regra.

O reaparecimento automático também continua no pipeline existente: nova observation válida reutiliza o mesmo fingerprint/Finding, reativa a presença quando necessário, registra `UNARCHIVE/REAPPEARED` ligado ao CollectionRun e remove o item do Histórico no próximo refetch. O lifecycle humano não é reaberto silenciosamente.

### Multi-cloud e multi-currency

A consulta histórica permanece provider-neutral e suporta AWS e OCI pelos mesmos campos `provider + account_id` usados no domínio atual. Labels genéricos usam Conta, Provider/Cloud e Recurso; não foi criada semântica AWS-only para registros OCI.

> valores AWS e OCI mantêm suas moedas originais. Pricing OCI fornecido para o projeto está em BRL, enquanto o pricing AWS utilizado pelo sistema é em USD. Nenhuma agregação entre moedas diferentes deve ocorrer sem uma futura camada explícita de conversão.

A listagem usa o `currency` persistido de cada oportunidade. O resumo da página agrega apenas valores da mesma moeda e apresenta cada moeda separadamente; não existe soma BRL + USD nem conversão cambial.

### Performance, queries e índices

A Etapa 23.6 não cria uma segunda listagem nem consulta timelines por linha. O caminho principal permanece duas queries de listagem (COUNT + página limitada); detalhe e históricos são carregados sob demanda.

A revisão das queries confirmou reaproveitamento dos índices existentes introduzidos nas etapas anteriores: `findings.archived_at`, índices de `provider`, `account_id`, `presence_status`, e o composto `(status, archived_at, last_seen_at)`, além dos índices próprios de cada histórico por oportunidade/timestamp. Não foi identificada query real que justificasse nova migration/índice composto nesta etapa; índices especulativos não foram adicionados.

### Testes

A cobertura específica da 23.6 valida:

- listagem histórica contendo somente arquivadas;
- regressão do default operacional excluindo arquivadas;
- paginação e ordenação por `archived_at`;
- filtros combinados por provider, conta, status humano, presença técnica e serviço;
- filtro por período de arquivamento e motivo `RETENTION_POLICY`;
- AWS/USD e OCI/BRL preservados sem normalização cambial;
- detalhe de registro arquivado;
- archive history e contexto da política;
- desarquivamento sem alterar status/presença e remoção da lista histórica;
- auditabilidade do evento de unarchive;
- options da workspace respeitando o archive state;
- query string da aba Histórico, seus filtros e defaults;
- presença das quatro abas, separação visual entre status/presença, detalhe histórico e ação de desarquivamento;
- preservação das três abas e ações operacionais existentes.

As suítes cumulativas continuam cobrindo reaparecimento automático, proteção da retenção após unarchive, lifecycle humano, reconciliação técnica, migrations e compatibilidade AWS/OCI.

### Migration e limitações deliberadas

Nenhuma migration foi criada. A Etapa 23.6 consome exclusivamente estruturas persistentes existentes até `0023_opportunity_retention`.

Ficam deliberadamente fora desta etapa: edição de pricing OCI, módulo Fluxo/ledger de savings realizados, Billing/Cost Explorer, instrumentação de custo CloudWatch, purge físico, conversão cambial, redesign global e bulk unarchive. A configuração visual da política de retenção também não foi criada.
