name: Task 23.18 roadmap sync

on:
  push:
    branches: [feat/23-18-cloudwatch-cost-engine]

permissions:
  contents: write

jobs:
  append-roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append roadmap section once
        shell: bash
        run: |
          if grep -q '^## Etapa 23.18 — CloudWatch Cost Engine do DeepOps$' docs/implementation-roadmap.md; then
            exit 0
          fi
          echo '' | base64 -d >> docs/implementation-roadmap.md
          git add docs/implementation-roadmap.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: record task 23.18 in implementation roadmap'
          git push
