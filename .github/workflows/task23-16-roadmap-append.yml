name: Task 23.16 roadmap append

on:
  push:
    branches:
      - feat/23-16-aws-billing-ui

permissions:
  contents: write

jobs:
  append-roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/23-16-aws-billing-ui
          fetch-depth: 0
      - name: Append Task 23.16 documentation
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          path = Path("docs/implementation-roadmap.md")
          heading = "## Etapa 23.16 — Interface multi-account de AWS Billing"
          if heading in path.read_text(encoding="utf-8"):
              raise SystemExit(0)
          payload = ""
          section = base64.b64decode(payload).decode("utf-8")
          current = path.read_text(encoding="utf-8").rstrip()
          path.write_text(current + "\n\n" + section.strip() + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/implementation-roadmap.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: document Task 23.16 AWS Billing UI"
          git push origin HEAD:feat/23-16-aws-billing-ui
