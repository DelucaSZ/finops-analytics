name: Task 24.8 finalizer

on:
  push:
    branches:
      - task-24.8-opportunity-discovery-filters

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-24.8-opportunity-discovery-filters
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Task 24.8 integration fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f"Expected snippet not found in {path}")
              target.write_text(text.replace(old, new, 1))

          replace(
              "backend/app/services/opportunity_bulk_archiving.py",
              '    payload.pop("archive_reason", None)\n    return {',
              '    payload.pop("archive_reason", None)\n    payload.pop("comparison_available", None)\n    if not payload.get("discovery_type"):\n        payload.pop("baseline_collection_run_id", None)\n    return {',
          )

          replace(
              "backend/app/migrations/versions/0034_opportunity_discovery_runs.py",
              'depends_on = None\n\n\ndef upgrade() -> None:',
              'depends_on = None\n\n\ndef _create_index_if_missing(name: str, table: str, columns: list[str]) -> None:\n    inspector = sa.inspect(op.get_bind())\n    if name not in {item["name"] for item in inspector.get_indexes(table)}:\n        op.create_index(name, table, columns)\n\n\ndef upgrade() -> None:',
          )
          replace(
              "backend/app/migrations/versions/0034_opportunity_discovery_runs.py",
              '    op.create_index(\n        "ix_findings_first_seen_collection_run_id",',
              '    _create_index_if_missing("ix_findings_first_seen_at", "findings", ["first_seen_at"])\n    op.create_index(\n        "ix_findings_first_seen_collection_run_id",',
          )

          replace(
              "backend/app/tests/test_backend_performance.py",
              '            assert summary["recent_changes"]["new"] == 4\n            assert summary["recent_changes"]["no_longer_detected"] == 6',
              '            assert summary["recent_changes"]["new"] == 4\n            # This fixture has no authoritative SUCCESS scope coverage, so absence is not\n            # classified as no longer detected.\n            assert summary["recent_changes"]["no_longer_detected"] == 0',
          )

          replace(
              "backend/app/tests/test_dashboard.py",
              '    assert recent["new"] == 1  # opp-010 only in A target versus A baseline\n    assert recent["no_longer_detected"] == 2  # opp-006 and opp-008 disappeared from A',
              '    assert recent["new"] == 1  # opp-010 only in A target versus A baseline\n    # No SUCCESS CollectionScopeExecution coverage is seeded, so disappearances are unknown.\n    assert recent["no_longer_detected"] == 0',
          )

          replace(
              "backend/app/tests/test_opportunity_migration.py",
              '            == "0033_opportunity_policy"',
              '            == "0034_opportunity_discovery_runs"',
          )
          PY

      - name: Format modified Python files
        run: |
          pip install ruff==0.17.1
          ruff format \
            backend/app/services/opportunity_bulk_archiving.py \
            backend/app/migrations/versions/0034_opportunity_discovery_runs.py \
            backend/app/tests/test_backend_performance.py \
            backend/app/tests/test_dashboard.py \
            backend/app/tests/test_opportunity_migration.py

      - name: Commit fixes and remove helper workflow
        shell: bash
        run: |
          git rm .github/workflows/task-24-8-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/opportunity_bulk_archiving.py \
                  backend/app/migrations/versions/0034_opportunity_discovery_runs.py \
                  backend/app/tests/test_backend_performance.py \
                  backend/app/tests/test_dashboard.py \
                  backend/app/tests/test_opportunity_migration.py
          git commit -m "Fix Task 24.8 integration regressions"
          git push origin HEAD:task-24.8-opportunity-discovery-filters
